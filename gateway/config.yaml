name: ha-didcomm
version: "0.0.9"
slug: ha_didcomm
description: DIDComm and verifiable-credential access control for Home Assistant
url: https://github.com/jacksonriding/ha-didcomm
stage: experimental
init: false
startup: application
boot: auto
homeassistant_api: true
arch:
  - amd64
  - aarch64
ports:
  8443/tcp: 8000
ports_description:
  8443/tcp: TLS-protected DIDComm and integration status API
map:
  - type: ssl
options:
  public_endpoint: https://homeassistant.local:8000
  home_id: home
  log_level: info
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  public_endpoint: url
  home_id: str
  log_level: list(debug|info|warning|error)
  certfile: str
  keyfile: str
backup: cold
