services:
  wallet-init:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    environment:
      ACAPY_PUBLIC_ENDPOINT: ${ACAPY_PUBLIC_ENDPOINT:?Set ACAPY_PUBLIC_ENDPOINT in .env.standalone}
    user: root
    entrypoint:
      - sh
      - -c
    command:
      - >-
        case "$${ACAPY_PUBLIC_ENDPOINT}" in https://*) ;; *) echo
        "ACAPY_PUBLIC_ENDPOINT must use HTTPS" >&2; exit 1;; esac;
        chown -R 1001:1001 /wallet
    volumes:
      - acapy-wallet:/wallet
    restart: "no"

  acapy:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    environment:
      ACAPY_ADMIN_API_KEY: ${ACAPY_ADMIN_API_KEY:?Set ACAPY_ADMIN_API_KEY in .env.standalone}
    command: >
      start
      --label ${ACAPY_LABEL:-ha-didcomm-home}
      --inbound-transport http 0.0.0.0 8000
      --outbound-transport http
      --admin 0.0.0.0 8021
      --webhook-url http://gateway:8080
      --endpoint ${ACAPY_PUBLIC_ENDPOINT:?Set ACAPY_PUBLIC_ENDPOINT in .env.standalone}
      --no-ledger
      --wallet-type askar
      --wallet-name home
      --wallet-key ${ACAPY_WALLET_KEY:?Set ACAPY_WALLET_KEY in .env.standalone}
      --auto-provision
      --log-level ${LOG_LEVEL:-info}
    volumes:
      - acapy-wallet:/home/aries/.acapy_agent/wallet
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os; from urllib.request import Request,urlopen; request=Request('http://127.0.0.1:8021/status/live',headers={'X-API-Key':os.environ['ACAPY_ADMIN_API_KEY']}); urlopen(request,timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    depends_on:
      wallet-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: ./gateway
      target: gateway
    environment:
      ACAPY_ADMIN_URL: http://acapy:8021
      ACAPY_ADMIN_API_KEY: ${ACAPY_ADMIN_API_KEY:?Set ACAPY_ADMIN_API_KEY in .env.standalone}
      CREDENTIAL_STORE_PATH: /data/credentials.sqlite3
      HA_BASE_URL: ${HA_BASE_URL:?Set HA_BASE_URL in .env.standalone}
      HA_TOKEN: ${HA_TOKEN:?Set HA_TOKEN in .env.standalone}
      HOME_ID: ${HOME_ID:-home}
      HOME_ISSUER_DID: ${HOME_ISSUER_DID:?Set HOME_ISSUER_DID in .env.standalone}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8080
      STATUS_HOST: 0.0.0.0
      STATUS_PORT: 8090
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - gateway-data:/data
    depends_on:
      acapy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  tls-proxy:
    image: nginx:1.28-alpine
    ports:
      - "${TLS_PORT:-8443}:8443"
    volumes:
      - ./deploy/tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH in .env.standalone}:/tls/cert.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH in .env.standalone}:/tls/key.pem:ro
    depends_on:
      acapy:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --no-check-certificate
        - --spider
        - https://127.0.0.1:8443/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  acapy-wallet:
  gateway-data:
