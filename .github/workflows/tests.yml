name: Gateway tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            gateway/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r gateway/requirements-dev.txt
      - name: Check component versions
        run: python scripts/check_versions.py
      - name: Run gateway tests
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q gateway/src custom_components

  compose:
    name: Validate Compose distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create development environment file
        run: cp gateway/.env.example gateway/.env
      - name: Validate development stack
        run: docker compose -f compose.yml config --quiet
      - name: Validate standalone stack
        run: >-
          docker compose --env-file .env.standalone.example
          -f compose.standalone.yml config --quiet
      - name: Validate reference controller stack
        run: >-
          docker compose --env-file .env.controller.example
          -f compose.controller.yml config --quiet

  integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: gateway/requirements-integration-test.txt
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r gateway/requirements-integration-test.txt
      - name: Run Home Assistant integration tests
        run: python -m pytest -o asyncio_mode=auto tests -q

  smoke:
    name: Docker end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run invitation-to-revocation workflow
        run: python scripts/docker_smoke_test.py

  lifecycle:
    name: Standalone install, upgrade, backup, and restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Run isolated deployment lifecycle
        run: python scripts/docker_lifecycle_test.py
