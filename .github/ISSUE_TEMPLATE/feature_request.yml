name: Feature request
description: Suggest an improvement that fits the project's scope
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. The project keeps DIDComm and
        authorization in the gateway and avoids changes to Home Assistant or
        ACA-Py internals.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is blocked, and what are they unable to do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Onboarding and owner experience
        - Remote controller interoperability
        - Authorization and credentials
        - Home Assistant integration
        - Deployment and operations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Explain any effect on permissions, identity data, network exposure, or secrets.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked the roadmap, existing issues, and non-goals.
          required: true
        - label: I did not include credentials, invitations, keys, tokens, or private DIDs.
          required: true
