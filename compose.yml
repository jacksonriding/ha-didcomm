services:
  acapy-home-wallet-init:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1001:1001 /wallet"]
    volumes:
      - acapy-home-wallet:/wallet
    restart: "no"

  acapy-user-wallet-init:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    user: root
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1001:1001 /wallet"]
    volumes:
      - acapy-user-wallet:/wallet
    restart: "no"

  acapy-home:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    environment:
      ACAPY_ADMIN_API_KEY: change-me-home-admin
    command: >
      start
      --label home-agent
      --inbound-transport http 0.0.0.0 8000
      --outbound-transport http
      --admin 0.0.0.0 8021
      --webhook-url http://gateway:8080
      --endpoint ${ACAPY_HOME_ENDPOINT:-http://acapy-home:8000}
      --no-ledger
      --wallet-type askar
      --wallet-name home
      --wallet-key change-me-dev-only
      --auto-provision
      --log-level info
    ports:
      - "127.0.0.1:8000:8000" # DIDComm inbound (local development)
      - "127.0.0.1:8021:8021" # Admin API (dev only)
    volumes:
      - acapy-home-wallet:/home/aries/.acapy_agent/wallet
    depends_on:
      acapy-home-wallet-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: ./gateway
      target: gateway
    env_file:
      - ./gateway/.env
    environment:
      ACAPY_ADMIN_API_KEY: change-me-home-admin
      CREDENTIAL_STORE_PATH: /data/credentials.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8090:8090"
    volumes:
      - gateway-data:/data
    depends_on:
      - acapy-home

  # Represents the remote/user agent, for local dev/testing only.
  acapy-user:
    image: ghcr.io/openwallet-foundation/acapy-agent:py3.13-1.6-lts
    environment:
      ACAPY_ADMIN_API_KEY: change-me-user-admin
    command: >
      start
      --label user-agent
      --inbound-transport http 0.0.0.0 8000
      --outbound-transport http
      --admin 0.0.0.0 8021
      --endpoint http://acapy-user:8000
      --no-ledger
      --wallet-type askar
      --wallet-name user
      --wallet-key change-me-dev-only
      --auto-provision
      --auto-respond-credential-offer
      --auto-store-credential
      --log-level info
    ports:
      - "127.0.0.1:8010:8000" # DIDComm inbound (local development)
      - "127.0.0.1:8031:8021" # Admin API (dev only)
    volumes:
      - acapy-user-wallet:/home/aries/.acapy_agent/wallet
    depends_on:
      acapy-user-wallet-init:
        condition: service_completed_successfully

volumes:
  acapy-home-wallet:
  acapy-user-wallet:
  gateway-data:

